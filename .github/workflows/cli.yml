name: CLI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

env:
  # Enable Docker BuildKit for better performance
  DOCKER_BUILDKIT: 1

jobs:
  test-evm:
    runs-on: ubuntu-latest
    timeout-minutes: 40  # Set explicit timeout
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          install: true

      - name: Build and test EVM CLI
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.cli
          target: cli-local-test
          load: true
          push: false
          cache-from: |
            type=gha,scope=evm-build
          cache-to: |
            type=gha,mode=max,scope=evm-build
          build-args: |
            BUILDKIT_INLINE_CACHE=1

  test-solana:
    runs-on: tilt-kube-public
    timeout-minutes: 45  # Solana builds take longer
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          install: true

      - name: Build and test Solana CLI
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.cli
          target: cli-local-test-solana
          load: true
          push: false
          cache-from: |
            type=gha,scope=solana-build
          cache-to: |
            type=gha,mode=max,scope=solana-build
          build-args: |
            BUILDKIT_INLINE_CACHE=1

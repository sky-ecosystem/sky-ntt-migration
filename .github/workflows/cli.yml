name: CLI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - fix-workflow

env:
  # Global environment variables for consistent caching
  DOCKER_BUILDKIT: 1
  BUILDX_BUILDER: docker-container

jobs:
  test-evm:
    runs-on: ubuntu-latest  #ubuntu-latest-4-cores  # Use 4-core runners for better performance
    timeout-minutes: 30  # Set explicit timeout
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          use: true

      - name: Build and test EVM CLI
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.cli
          target: cli-local-test
          platforms: linux/amd64
          push: false
          cache-from: |
            type=gha,scope=evm-build
            type=gha,scope=base-build
          cache-to: |
            type=gha,mode=max,scope=evm-build
          build-args: |
            BUILDKIT_INLINE_CACHE=1
          outputs: type=cacheonly

  test-solana:
    runs-on: tilt-kube-public
    timeout-minutes: 45  # Solana builds take longer
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          use: true

      - name: Build and test Solana CLI
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.cli
          target: cli-local-test-solana
          platforms: linux/amd64
          push: false
          cache-from: |
            type=gha,scope=solana-build
            type=gha,scope=base-solana-build
            type=gha,scope=base-build
          cache-to: |
            type=gha,mode=max,scope=solana-build
          build-args: |
            BUILDKIT_INLINE_CACHE=1
          outputs: type=cacheonly

  # Optional: Cleanup old cache entries to prevent storage bloat
  cleanup-cache:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/fix-workflow'
    needs: [test-evm, test-solana]
    steps:
      - name: Cleanup old cache entries
        run: |
          # GitHub automatically manages cache cleanup, but you can add custom logic here
          echo "Cache cleanup completed"
